name: Nightly Sync

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployed sync
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          test -n "$SYNC_URL"
          curl --fail --show-error --silent \
            -X POST \
            -H "X-Admin-Sync-Token: $SYNC_TOKEN" \
            "$SYNC_URL?force=1"
